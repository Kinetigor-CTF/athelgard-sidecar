function runPageAction(m) {
  const doc = document.getElementById('page').contentDocument;
  if (!doc) return { error: 'no page' };
  if (m.action === 'CLICK') {
    const el = doc.querySelector(m.selector);
    if (!el) return { error: 'not found: ' + m.selector };
    el.scrollIntoView({ block: 'center' }); el.click();
    return { ok: 'clicked ' + m.selector };
  }
  if (m.action === 'FILL') {
    const el = doc.querySelector(m.selector);
