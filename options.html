<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Athelgard Options</title>
<style>body{font:14px system-ui;background:#0d1117;color:#e6edf3;max-width:640px;margin:24px auto;padding:0 16px}
label{display:block;margin:14px 0 4px;color:#8b949e;font-size:12px;text-transform:uppercase}
input{width:100%;background:#161b22;border:1px solid #30363d;border-radius:6px;color:#e6edf3;padding:8px}
button{margin-top:18px;background:#238636;color:#fff;border:0;border-radius:6px;padding:10px 18px;cursor:pointer}
#ok{color:#3fb950;margin-left:10px}</style></head>
<body>
<h1>&#129417; Athelgard — Brain Wiring</h1>
<label>Brain endpoint (OpenAI-compatible)</label>
<input id="brainUrl" placeholder="http://localhost:11434/v1/chat/completions">
<label>API key (optional — stored locally only)</label>
<input id="brainKey" type="password">
<label>Model</label>
<input id="brainModel" placeholder="athelgard">
<label>Scoreboard target</label>
<input id="scoreboardUrl" placeholder="https://ctf.hackthebox.com">
<label>Operator callsign</label>
<input id="operatorName" placeholder="Captain">
<button id="save">Save</button><span id="ok"></span>
<script src="options.js"></script>
</body></html>
