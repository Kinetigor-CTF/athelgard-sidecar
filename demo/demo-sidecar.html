<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <base href="../">
  <link rel="stylesheet" href="sidepanel.css">
  <script>window.__SIDE = true;</script>
  <script src="demo/mock.js"></script>
</head>
<body>
  <header>
    <h1>&#129417; ATHELGARD</h1>
    <div id="ctx" class="ctx">no page linked</div>
  </header>
  <section id="flags">
    <h2>Flag Pipeline <span id="gate" class="gate">SEND GATE: ON</span></h2>
    <ul id="flagList"></ul>
  </section>
  <section id="chat">
    <div id="log"></div>
    <form id="composer">
      <input id="input" placeholder="Talk to Athelgard..." autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </section>
  <script src="sidepanel.js"></script>
  <script>
  // Demo brain: canned reasoning + the REAL playbook matcher from sidepanel.js.
  // (sidepanel.js defines playbookHints globally; we reuse it, only the LLM call is mocked.)
  window.think = async (userText, ctx) => {
    const flags = ctx.flags || [];
    const hints = await playbookHints(ctx);
    await new Promise(r => setTimeout(r, 700));
    if (/status|report|how/i.test(userText)) {
      return 'Readiness report, Captain. Page linked: "' + (ctx.title || 'unknown') + '". ' +
        flags.length + ' flag(s) visible. ' +
        (hints ? 'Playbook matched — see below. ' : 'No playbook match for this page. ') +
        'Pipeline and vault intact; nothing sits in chat anymore.';
    }
    if (hints) {
      return 'Playbook hit. This page smells like a Holmes 2026 scenario. ' +
        hints.slice(0, 900) + (hints.length > 900 ? '...' : '') +
        (flags.length ? ' FLAG: ' + flags[0] + ' — staged, awaiting your approval.' : '');
    }
    if (flags.length) {
      return 'Scanning. FLAG: ' + flags[0] + ' — staged. Approve below and it is on your clipboard.';
    }
    return 'Context received: "' + (ctx.title || 'no page') + '". No flags in view. Select text and I will re-scan.';
  };
  navigator.clipboard.writeText = (t) => { console.log('[demo] clipboard:', t); return Promise.resolve(); };
  </script>
</body>
</html>
